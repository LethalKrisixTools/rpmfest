<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPM Fest — Panel Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>

  <div id="app">
    <!-- LOGIN -->
    <div id="login-screen" class="screen">
      <div class="login-box">
        <div class="login-logo">RPM<span class="gold">FEST</span></div>
        <p class="login-sub">Panel de Administración</p>
        <form id="login-form">
          <input type="password" id="login-pass" placeholder="Contraseña" autofocus>
          <button type="submit" class="btn btn-primary">ACCEDER</button>
          <p id="login-error" class="login-error"></p>
        </form>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-screen" class="screen hidden">
      <nav class="admin-nav">
        <div class="admin-nav-inner">
          <span class="admin-nav-logo">RPM<span class="gold">FEST</span> · ADMIN</span>
          <div class="admin-nav-right">
            <span class="admin-nav-status" id="conn-status">Conectando...</span>
            <button id="btn-logout" class="btn btn-small">Salir</button>
          </div>
        </div>
      </nav>

      <div class="admin-body">
        <aside class="admin-sidebar">
          <button class="sidebar-btn active" data-tab="evento">Evento</button>
          <button class="sidebar-btn" data-tab="hero">Hero</button>
          <button class="sidebar-btn" data-tab="actividades">Actividades</button>
          <button class="sidebar-btn" data-tab="horarios">Horarios</button>
          <button class="sidebar-btn" data-tab="stats">Estadísticas</button>
          <button class="sidebar-btn" data-tab="sponsors">Sponsors</button>
        </aside>

        <main class="admin-main">
          <div class="admin-toolbar">
            <span id="tab-title" class="admin-tab-title">Evento</span>
            <div class="admin-toolbar-actions">
              <button id="btn-preview" class="btn btn-outline">Previsualizar</button>
              <button id="btn-save" class="btn btn-primary">Guardar Cambios</button>
            </div>
          </div>

          <div id="tab-content" class="admin-content"></div>
        </main>
      </div>
    </div>
  </div>

  <!-- PREVIEW OVERLAY -->
  <div id="preview-overlay" class="preview-overlay hidden">
    <div class="preview-header">
      <span>Vista previa — rpmfest.com</span>
      <button id="btn-close-preview" class="btn btn-small">Cerrar</button>
    </div>
    <iframe id="preview-iframe" class="preview-iframe"></iframe>
  </div>

  <script src="app.js"></script>
</body>
</html>
