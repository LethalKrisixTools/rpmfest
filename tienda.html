<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RPM Fest — Tienda</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
.store-hero{padding:150px 20px 70px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#400a10,transparent 60%)}
.store-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}.product-card{background:#100b0d;border:1px solid #3b2023;border-radius:12px;overflow:hidden;transition:.2s}.product-card:hover{transform:translateY(-4px);border-color:#f79f23}.product-image{width:100%;aspect-ratio:1/1;object-fit:cover;background:#171114}.product-body{padding:20px}.product-title{font-size:20px;margin:0 0 8px}.product-desc{color:#a17467;min-height:48px}.product-price{font-size:24px;font-weight:800;margin:18px 0}.cart-fab{position:fixed;right:24px;bottom:24px;z-index:20;border:0;cursor:pointer}.cart-panel{position:fixed;right:0;top:0;width:min(430px,100%);height:100%;background:#0e0d12;z-index:30;padding:28px;box-shadow:-10px 0 40px #000;overflow:auto;transform:translateX(100%);transition:.25s}.cart-panel.open{transform:none}.cart-row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #332124}.cart-row img{width:64px;height:64px;object-fit:cover}.cart-close{float:right;background:none;color:#eee;border:0;font-size:28px;cursor:pointer}.checkout-form input{width:100%;box-sizing:border-box;margin:7px 0;padding:13px;border-radius:6px;border:1px solid #43262a;background:#171114;color:#fff}.empty{padding:80px 0;text-align:center;color:#a17467}
</style>
</head><body>
<nav class="navbar"><div class="nav-container"><a href="index.html" class="nav-logo"><img src="logo-rpmfest.png" alt="RPM Fest" class="nav-logo-img"></a><button class="nav-toggle" aria-label="Menú"><span></span><span></span><span></span></button><ul class="nav-links"><li><a href="index.html#evento">Evento</a></li><li><a href="index.html#experiencias">Experiencias</a></li><li><a href="eventos.html">Próximos Eventos</a></li><li><a href="tienda.html">Tienda</a></li></ul></div></nav>
<header class="store-hero"><span class="section-tag">RPM FEST STORE</span><h1 class="section-title">MERCH <span class="gold">OFICIAL</span></h1><p class="section-desc">Productos oficiales de RPM Fest.</p></header>
<main class="section"><div class="container"><div id="products" class="store-grid"></div></div></main>
<button id="cart-btn" class="btn btn-primary cart-fab">🛒 Cesta (<span id="cart-count">0</span>)</button>
<aside id="cart" class="cart-panel"><button id="close-cart" class="cart-close">×</button><h2>Cesta</h2><div id="cart-items"></div><h3>Total: <span id="cart-total">0,00 €</span></h3><form id="checkout" class="checkout-form"><input name="name" required placeholder="Nombre completo"><input name="email" type="email" required placeholder="Email"><input name="address" required placeholder="Dirección de envío"><input name="city" required placeholder="Ciudad"><input name="postalCode" required placeholder="Código postal"><button class="btn btn-primary" style="width:100%;margin-top:10px">PAGAR</button><p id="checkout-msg"></p></form></aside>
<footer class="footer"><div class="container"><div class="footer-bottom"><p>© 2026 Diamond Squad Events. Todos los derechos reservados.</p></div></div></footer>
<script>
const productsEl=document.getElementById('products'),cartEl=document.getElementById('cart'),itemsEl=document.getElementById('cart-items'),countEl=document.getElementById('cart-count'),totalEl=document.getElementById('cart-total');let products=[],cart=[];
const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
async function init(){const r=await fetch('data/store.json?_='+Date.now());const d=await r.json();products=d.products||[];renderProducts();renderCart()}
function renderProducts(){const active=products.filter(p=>p.active!==false);productsEl.innerHTML=active.length?active.map(p=>`<article class="product-card"><img class="product-image" src="${esc(p.images?.[0]||'assets/product-placeholder.svg')}" alt="${esc(p.name)}"><div class="product-body"><h2 class="product-title">${esc(p.name)}</h2><p class="product-desc">${esc(p.shortDescription||p.description||'')}</p><div class="product-price">${money(p.price)}</div><button class="btn btn-primary" onclick="add('${esc(p.id)}')">AÑADIR A LA CESTA</button></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">La tienda estará disponible próximamente.</div>'}
function add(id){const p=products.find(x=>x.id===id);if(!p)return;const x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,qty:1});renderCart()}
function remove(id){cart=cart.filter(x=>x.id!==id);renderCart()}
function renderCart(){let total=0,n=0;itemsEl.innerHTML=cart.length?cart.map(x=>{const p=products.find(y=>y.id===x.id);if(!p)return '';total+=p.price*x.qty;n+=x.qty;return `<div class="cart-row"><img src="${esc(p.images?.[0]||'assets/product-placeholder.svg')}"><div><b>${esc(p.name)}</b><br>${x.qty} × ${money(p.price)}<br><button type="button" onclick="remove('${esc(p.id)}')">Quitar</button></div></div>`}).join(''):'<p class="empty">Tu cesta está vacía.</p>';countEl.textContent=n;totalEl.textContent=money(total)}
document.getElementById('cart-btn').onclick=()=>cartEl.classList.add('open');document.getElementById('close-cart').onclick=()=>cartEl.classList.remove('open');
document.getElementById('checkout').onsubmit=async e=>{e.preventDefault();if(!cart.length)return;const msg=document.getElementById('checkout-msg');msg.textContent='Redirigiendo al pago…';const customer=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/create-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart,customer})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error de pago');location.href=d.checkoutUrl}catch(err){msg.textContent=err.message}};
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}init();
</script></body></html>
